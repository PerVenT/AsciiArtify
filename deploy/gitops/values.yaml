repoURL: ""
targetRevision: main
env: dev-gitops
argocdNamespace: argocd

apps:
  - name: cert-manager
    namespace: cert-manager
    path: deploy/platform/cert-manager
    wave: "0"
  - name: mesh-pki
    namespace: cert-manager
    path: deploy/platform/mesh-pki
    wave: "1"
  - name: traefik
    namespace: traefik
    path: deploy/platform/traefik
    wave: "2"
  - name: authelia
    namespace: authelia
    path: deploy/platform/authelia
    wave: "3"
  - name: argocd
    namespace: argocd
    path: deploy/platform/argocd
    wave: "4"
