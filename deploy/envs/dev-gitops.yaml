# Зовнішній dev-контур через ArgoCD (приклад 1:1 зі staging/prod; замініть домен під ваш dev-стенд)
global:
  baseDomain: localtest.me
  clusterIssuer: mesh
  internalClusterIssuer: mesh
  autheliaNamespace: authelia
  argocdNamespace: argocd
  caSecret: mesh-ca-public

meshCA:
  enabled: true

bundle:
  enabled: true

authelia:
  configMap:
    session:
      cookies:
        - domain: localtest.me
          subdomain: auth
          default_redirection_url: https://app.localtest.me
    access_control:
      rules:
        - domain: auth.localtest.me
          policy: bypass
        - domain: "*.localtest.me"
          policy: one_factor
    identity_providers:
      oidc:
        clients:
          - client_name: ArgoCD
            client_id: argocd
            client_secret:
              path: /secrets/oidc/argocd_client_secret_hash
            public: false
            authorization_policy: one_factor
            consent_mode: implicit
            require_pkce: false
            claims_policy: argocd
            redirect_uris:
              - https://argocd.localtest.me/auth/callback
            scopes:
              - openid
              - profile
              - email
              - groups
            grant_types:
              - authorization_code
            response_types:
              - code
            token_endpoint_auth_method: client_secret_basic

argo-cd:
  global:
    domain: argocd.localtest.me
  configs:
    cm:
      url: https://argocd.localtest.me
      oidc.config: |
        name: Authelia
        issuer: https://auth.localtest.me
        clientID: argocd
        clientSecret: $oidc.argocd.clientSecret
        requestedScopes:
          - openid
          - profile
          - email
          - groups
