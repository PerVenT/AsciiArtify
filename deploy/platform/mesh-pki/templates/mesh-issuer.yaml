{{- $issuer := required "global.internalClusterIssuer is required" .Values.global.internalClusterIssuer }}
{{- if .Values.meshCA.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mesh-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mesh-ca
  namespace: {{ .Values.meshCA.namespace }}
spec:
  isCA: true
  commonName: mesh-ca
  secretName: mesh-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: Ed25519
  issuerRef:
    name: mesh-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $issuer | quote }}
spec:
  ca:
    secretName: mesh-ca
{{- end }}
