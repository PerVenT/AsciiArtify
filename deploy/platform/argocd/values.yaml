global:
  baseDomain: ""
  internalClusterIssuer: ""

argo-cd:
  fullnameOverride: argocd

  dex:
    enabled: false

  notifications:
    enabled: false

  applicationSet:
    replicas: 0

  configs:
    cm:
      admin.enabled: false
    rbac:
      policy.default: role:readonly
      policy.csv: |
        g, admins, role:admin
      scopes: "[groups]"
